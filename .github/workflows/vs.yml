name: VS2026 - Build and Save

on:
  workflow_dispatch:
    inputs:
      output:
        description: "Where should the files be saved?"
        required: true
        default: repository
        type: choice
        options:
          - repository
          - artifacts

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        if: ${{ github.event.inputs.output == 'repository' }}
        uses: actions/checkout@v4

      - name: Download Bootstrapper
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/vs/18/Stable/vs_community.exe" -OutFile "vs_community.exe"
        shell: powershell

      - name: Create Offline Layout
        run: |
          Write-Host "Starting Layout Creation..."
          .\vs_community.exe --layout "C:\VS2026_Layout" --config "response.json" --lang en-US --quiet --wait | Out-File "layout.log" -Encoding UTF8
          Get-Content "layout.log" -Tail 30
        shell: powershell

      - name: Compress and Split (45MB parts)
        run: |
          if (Test-Path "C:\VS2026_Layout") {
            New-Item -Path "downloads/VS2026" -ItemType Directory -Force

            & "C:\Program Files\7-Zip\7z.exe" a -v45m -mx3 "downloads/VS2026/VS2026.part" "C:\VS2026_Layout\*"

            Write-Host "Total parts created: $((Get-ChildItem downloads/VS2026).Count)"
          }
          else {
            Write-Host "ERROR: Layout folder not found"
            exit 1
          }
        shell: powershell

      # ---------------- Repository ----------------

      - name: Push in batches of 10 files
        if: ${{ github.event.inputs.output == 'repository' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          $parts = Get-ChildItem "downloads/VS2026/VS2026.part.*" | Sort-Object Name
          $total = $parts.Count
          $batchSize = 10

          for ($i = 0; $i -lt $total; $i += $batchSize) {

            $batch = $parts | Select-Object -Skip $i -First $batchSize

            Write-Host "Pushing batch $([math]::Floor($i/$batchSize)+1)"

            git add $batch.FullName
            git commit -m "Add VS2026 batch $([math]::Floor($i/$batchSize)+1)" --allow-empty
            git push
          }
        shell: powershell

      # ---------------- Artifacts ----------------

      - name: Upload Artifact
        if: ${{ github.event.inputs.output == 'artifacts' }}
        uses: actions/upload-artifact@v4
        with:
          name: VS2026
          path: downloads/VS2026/
          compression-level: 0
